<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<title>교통대 충주 가이드 사용법</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f3f5f9;--surface:#fff;--line:#e2e6ee;--text:#192434;--muted:#5f6b7e;--blue:#2767e8;--sky:#6ea2ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;letter-spacing:-.02em;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 72px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:clamp(22px,3.4vw,34px);font-weight:800;letter-spacing:-.035em}
.top a{flex:none;font-size:14px;font-weight:650;color:var(--muted);text-decoration:none;background:#e7ebf2;border-radius:999px;padding:9px 14px}
.player{background:#0a1120;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(16,28,56,.25)}
.stagewrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#0a1120}
.player:fullscreen{border-radius:0;display:flex;flex-direction:column}
.player:fullscreen .stagewrap{flex:1;aspect-ratio:auto}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#c9d2e0;font-size:14px}
.ctrl button{font:inherit;font-weight:650;color:#eef2f8;background:#1c2638;border:0;border-radius:10px;height:38px;min-width:38px;padding:0 12px;cursor:pointer;white-space:nowrap}
.ctrl button:hover{background:#29364d}.ctrl .on{background:#1e3f86;color:#d6e4ff}
.ctrl .now{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ctrl .tc{font-variant-numeric:tabular-nums;color:#93a0b4;white-space:nowrap}
.ctrl input{flex:1;min-width:50px;accent-color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.card{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(16,28,56,.12)}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.thumb{position:relative;aspect-ratio:16/9;background:#0a1120 center/cover no-repeat}
.dur{position:absolute;right:9px;bottom:9px;background:rgba(0,0,0,.68);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.meta{padding:12px 14px 15px}.no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta h3{margin:3px 0 4px;font-size:18px;letter-spacing:-.025em}.meta p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
@media(max-width:560px){.ctrl .now,.ctrl .opt{display:none}}

/* 무대 1920×1080: 모든 움직임은 시간 t 하나로 계산한다 */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;color:#fff;transform-origin:0 0;
 background:radial-gradient(1100px 800px at 74% 40%,rgba(39,103,232,.34),transparent 66%),radial-gradient(800px 600px at 8% 100%,rgba(110,162,255,.1),transparent 70%),#0a1120}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.phone{position:absolute;left:-16px;top:-16px;width:422px;height:876px;padding:16px;border-radius:62px;background:#04070d;box-shadow:0 0 0 2px #2b3549,0 50px 100px rgba(0,0,0,.6)}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#fff}
.ly{position:absolute;inset:0;overflow:hidden;background:#fff;visibility:hidden}
.ly img{position:absolute;left:0;top:0;width:390px;display:block}.ly img.bar{top:auto;bottom:0}
.spot{position:absolute;border-radius:14px;box-shadow:0 0 0 1000px rgba(6,12,28,.56),0 0 0 3px #6ea2ff,0 0 26px 4px rgba(110,162,255,.8);opacity:0;z-index:5}
.fing{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:8;opacity:0;will-change:transform}
.ring{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid #6ea2ff;z-index:7;opacity:0}
.spk{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#6ea2ff;z-index:7;opacity:0}
.roll{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;font-size:25px;font-weight:800;color:#2767e8;z-index:4;visibility:hidden;text-align:center}
.fly{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;color:#e5484d;z-index:9;opacity:0}
.copy{position:absolute;left:120px;top:0;width:900px;height:1080px}
.hd{position:absolute;left:0;top:210px;opacity:0}
.eb{display:inline-block;font-size:30px;font-weight:750;color:#a9c6ff;background:rgba(110,162,255,.16);border-radius:999px;padding:10px 24px;margin-bottom:26px}
.tl{display:block;font-size:92px;line-height:1.16;font-weight:850;letter-spacing:-.045em;white-space:nowrap}
.tw{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .02em .1em;margin:-.04em -.02em -.1em}
.twi{display:inline-block;will-change:transform}
.st{position:absolute;left:0;display:flex;align-items:center;gap:20px;font-size:40px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;opacity:0}
.st b{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;background:#27324a;color:#c5d0e2}
.st.cur b{background:#2767e8;color:#fff;box-shadow:0 0 0 7px rgba(39,103,232,.3)}
.render,.render body{background:#0a1120;overflow:hidden}
</style>
</head>

  <div class="top"><h1>교통대 충주 가이드 사용법</h1><a href="./#/my">가이드로 돌아가기</a></div>

const CLIPS = [

 heads:[[0,'학교생활',['자주 묻는 안내를','모았습니다']]],

 layers:[{at:0,src:'life'},{at:1.1,src:'life_move',tr:'cut'},{at:2.7,src:'life',tr:'cut'},{at:4.5,src:'life_read_full',from:[25,300,79,100],scroll:[[5.6,7,300]]}],

 cam:[[0,1,195,422],[.5,1.25,195,480],[2.7,1.25,195,350],[4.3,1,195,422]],

 steps:[[.4,'조건을 고르고'],[1.9,'뽑기를 누르면'],[4,'한 곳을 골라 줍니다']],
 layers:[{at:0,src:'pick'},{at:1.1,src:'pick_cheap',tr:'cut'},{at:3.9,src:'pick_result',tr:'cut'}],

 cam:[[0,1,195,422],[.5,1.3,195,240],[3.9,1,195,422]]},
{id:'explore',title:'둘러보기',desc:'사진을 넘겨 보다가 끌리는 곳으로',poster:2.6,dur:9,
 heads:[[0,'둘러보기',['찾지 않아도','발견합니다']]],
 steps:[[.4,'사진을 넘겨 구경하고'],[3.8,'끌리는 사진을 누르면 그 장소로'],[6.2,'같은 건물 사진은 장소 목록으로']],
 layers:[{at:0,src:'explore_full',bar:'bar_explore',scroll:[[.9,2.6,1500],[2.8,3.5,-1500]]},{at:4.4,src:'explore_d',from:[131,299,259,323]},{at:6.2,src:'explore',tr:'cut'},{at:6.9,src:'explore_sheet',from:[0,844,390,0]}],
 taps:[[4.3,260,460],[6.8,326,705]]},
{id:'my',title:'찜과 마이',desc:'마음에 든 곳을 모아 두고 다시 보기',poster:3.3,dur:6.4,
 heads:[[0,'찜과 마이',['마음에 든 곳은','모아 두세요']]],

 layers:[{at:0,src:'detail'},{at:1.1,src:'heart_on',tr:'cut'},{at:2.5,src:'my',tr:'push'},{at:4.2,src:'saved',tr:'push'}],

{id:'origin',title:'거리 기준 바꾸기',desc:'학교 기준을 내 위치 기준으로',poster:3.6,dur:7.2,
 heads:[[0,'거리 기준',['내 위치 기준으로','바꿔 보세요']]],
 steps:[[.4,'기준 위치를 누르고'],[1.9,'현재 위치로 찾은 뒤'],[3.2,'맞으면 이 위치로 보기'],[4.9,'거리가 내 위치 기준으로']],

];
// 「한 번에 보기」는 위 영상들을 그대로 이어 붙여 빠르게 튼다
function concat(ids, k) {
  const out = {id:'flow',title:'한 번에 보기',desc:'앱 전체 흐름을 한 편으로',poster:30,heads:[],steps:[],layers:[],taps:[],cam:[],spots:[],rolls:[],flies:[]};
  let off = 0;
  const f = v => (v + off);
  ids.forEach(id => {
    const c = CLIPS.find(x => x.id === id);
    const sc = v => f(v / k);
    c.heads.forEach(h => out.heads.push([sc(h[0]), h[1], h[2]]));
    c.steps.forEach(s => out.steps.push([sc(s[0]), s[1]]));
    c.layers.forEach((l, i) => out.layers.push({...l, at: sc(l.at), tr: i === 0 ? 'fade' : l.tr, scroll: l.scroll && l.scroll.map(([a,b,d]) => [sc(a), sc(b), d])}));
    (c.taps||[]).forEach(t => out.taps.push([sc(t[0]), t[1], t[2]]));
    (c.cam||[[0,1,195,422]]).forEach(a => out.cam.push([sc(a[0]), a[1], a[2], a[3]]));
    (c.spots||[]).forEach(s => out.spots.push([sc(s[0]), sc(s[1]), s[2], s[3], s[4], s[5]]));
    (c.rolls||[]).forEach(r => out.rolls.push({...r, t0: sc(r.t0), t1: sc(r.t1)}));
    (c.flies||[]).forEach(a => out.flies.push([sc(a[0]), sc(a[1]), a[2], a[3], a[4], a[5]]));
    off += c.dur / k;
  });
  out.dur = off;
  return out;
}
CLIPS.push(concat(['home','find','detail','map','life','pick','explore','my'], 1.3));

const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = p => p < .5 ? 4*p*p*p : 1 - (-2*p+2)**3/2;
const outC = p => 1 - (1-p)**3;
const expo = p => p >= 1 ? 1 : 1 - 2**(-10*p);
const back = p => { const c = 1.5; return 1 + (c+1)*(p-1)**3 + c*(p-1)**2; };
const add = (par, cls, html) => { const e = document.createElement('div'); e.className = cls; if (html) e.innerHTML = html; par.append(e); return e; };
const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8.5-5.2-8.5-11.2A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 3.2C20.5 15.8 12 21 12 21z"/></svg>';
const CX = 1400, CY = 540, BASE = 1.12;

function build(stage, c) {
  stage.innerHTML = '';
  const copy = add(stage, 'copy'), world = add(stage, 'world');
  const phone = add(world, 'phone'), screen = add(phone, 'screen');
  const heads = c.heads.map(([t, eb, lines], i) => {
    const el = add(copy, 'hd');
    el.innerHTML = `<div class="eb">${eb}</div>` + lines.map(l => `<span class="tl">${l.split(' ').map(w => `<span class="tw"><span class="twi">${w}</span></span>`).join(' ')}</span>`).join('');
    return {t, el, words:[...el.querySelectorAll('.twi')], end:(c.heads[i+1]||[c.dur+1])[0]};
  });
  let group = 0, n = 0;
  const steps = c.steps.map(([t, text]) => {
    while (group + 1 < heads.length && t >= heads[group+1].t) { group++; n = 0; }
    const el = add(copy, 'st', `<b>${n+1}</b><span>${text}</span>`);
    el.style.top = 520 + n*84 + 'px'; n++;
    return {t, el, end:heads[group].end};
  });
  steps.forEach((s, i) => s.next = (steps[i+1] && steps[i+1].end === s.end) ? steps[i+1].t : s.end);
  const layers = c.layers.map(l => {
    const el = add(screen, 'ly');
    const img = new Image(); img.src = m(l.src); img.alt = ''; el.append(img);
    if (l.bar) { const b = new Image(); b.src = m(l.bar); b.className = 'bar'; b.alt = ''; el.append(b); }
    return {...l, el, img};
  });
  const rolls = (c.rolls||[]).map(r => { const el = add(screen, 'roll'); Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'}); return {...r, el}; });
  const spots = (c.spots||[]).map(s => { const el = add(screen, 'spot'); Object.assign(el.style,{left:s[2]+'px',top:s[3]+'px',width:s[4]+'px',height:s[5]+'px'}); return {t0:s[0],t1:s[1],el}; });
  const ring = add(world, 'ring'), fing = add(world, 'fing');
  const spks = Array.from({length:8}, () => add(world, 'spk'));
  const flies = (c.flies||[]).map(a => ({a, el:add(world, 'fly', HEART)}));
  const taps = c.taps || [], cam = c.cam && c.cam.length ? c.cam : [[0,1,195,422]];

  function update(t) {
    // 카메라: 다음 키로 0.6초 동안 옮겨 간다
    let z = cam[0][1], fx = cam[0][2], fy = cam[0][3];
    for (const [kt, kz, kx, ky] of cam) { if (t < kt) break; const p = io(seg(t, kt, kt+.6)); z += (kz-z)*p; fx += (kx-fx)*p; fy += (ky-fy)*p; }
    const hw = 195/z, hh = 422/z;
    fx = clamp(fx, hw, 390-hw); fy = clamp(fy, hh, 844-hh);
    const s = BASE*z, intro = back(seg(t, 0, .5));
    world.style.transform = `translate(${CX - fx*s}px,${CY - fy*s + (1-intro)*90}px) scale(${s})`;
    world.style.opacity = seg(t, 0, .25);

    // 화면 층
    let top = 0;
    layers.forEach((l, i) => { const d = l.tr === 'cut' ? .1 : .36; if (t >= l.at + d) top = i; });
    layers.forEach((l, i) => {
      const on = t >= l.at && i >= top && (i === top || t < l.at + .4 || i > top);
      l.el.style.visibility = on ? 'visible' : 'hidden';
      if (!on) return;
      const raw = seg(t, l.at, l.at + (l.tr === 'cut' ? .1 : .36));
      let tf = 'none', clip = 'none', op = 1;
      if (l.tr === 'push') tf = `translateX(${(1-outC(raw))*100}%)`;
      else if (l.tr === 'cut' || l.tr === 'fade') op = raw;
      else if (l.from) { const p = expo(raw), [x,y,w,h] = l.from; clip = `inset(${y*(1-p)}px ${(390-x-w)*(1-p)}px ${(844-y-h)*(1-p)}px ${x*(1-p)}px round ${16*(1-p)}px)`; }
      l.el.style.transform = tf; l.el.style.clipPath = clip; l.el.style.opacity = op;
      let y = 0;
      for (const [a, b, d] of l.scroll || []) y += d * io(seg(t, a, b));
      l.img.style.transform = `translateY(${-y}px)`;
    });

    spots.forEach(s => { s.el.style.opacity = Math.min(seg(t, s.t0, s.t0+.22), 1-seg(t, s.t1-.2, s.t1)); });
    rolls.forEach(r => {
      const on = t >= r.t0 && t < r.t1;
      r.el.style.visibility = on ? 'visible' : 'hidden';
      if (on) r.el.textContent = r.names[Math.min(r.names.length-1, Math.floor(outC(seg(t, r.t0, r.t1))*r.names.length))];
    });

    // 손가락: 누르기 직전에 들어와서 눌렀다가 사라진다
    const tap = taps.find(a => t >= a[0]-.42 && t <= a[0]+.42);
    if (tap) {
      const [T, x, y] = tap, mv = outC(seg(t, T-.42, T-.04));
      const press = t < T ? 1 - .22*seg(t, T-.08, T) : .78 + .22*seg(t, T, T+.12);
      fing.style.opacity = Math.min(seg(t, T-.42, T-.28), 1-seg(t, T+.24, T+.42));
      fing.style.transform = `translate(${x + (1-mv)*70}px,${y + (1-mv)*110}px) scale(${press})`;
      const r = seg(t, T, T+.42);
      ring.style.opacity = t < T ? 0 : 1-r;
      ring.style.transform = `translate(${x}px,${y}px) scale(${.8+r*1.9})`;
      spks.forEach((e, i) => { const a = i/8*Math.PI*2, d = 26+expo(r)*46; e.style.opacity = t < T ? 0 : 1-r; e.style.transform = `translate(${x+Math.cos(a)*d}px,${y+Math.sin(a)*d}px) scale(${1-r*.6})`; });
    } else {
      fing.style.opacity = 0; ring.style.opacity = 0; spks.forEach(e => e.style.opacity = 0);
    }
    flies.forEach(({a:[t0,t1,x0,y0,x1,y1], el}) => {
      const p = seg(t, t0, t1), e = io(p);
      el.style.opacity = t >= t0 && t < t1 ? 1 : 0;
      el.style.transform = `translate(${x0+(x1-x0)*e}px,${y0+(y1-y0)*e - Math.sin(p*Math.PI)*170}px) scale(${1+Math.sin(p*Math.PI)*.8})`;
    });

    // 왼쪽 글: 낱말이 아래에서 올라오고, 단계는 차례로 쌓인다
    heads.forEach(h => {
      const on = t >= h.t && t < h.end;
      h.el.style.opacity = on ? 1 - seg(t, h.end-.14, h.end) : 0;
      if (on) h.words.forEach((w, i) => { w.style.transform = `translateY(${(1-expo(seg(t, h.t+.04+i*.05, h.t+.6+i*.05)))*112}%)`; });
    });
    steps.forEach(s => {
      const on = t >= s.t && t < s.end, cur = t < s.next;
      s.el.style.opacity = on ? seg(t, s.t, s.t+.2) * (cur ? 1 : .5) * (1-seg(t, s.end-.14, s.end)) : 0;
      s.el.style.transform = `translateX(${(1-expo(seg(t, s.t, s.t+.4)))*-36}px)`;
      s.el.classList.toggle('cur', on && cur);
    });
  }
  update(0);
  return {update, dur:c.dur};
}

const qs = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), wrap = document.getElementById('stagewrap');
function fit() {
  const w = wrap.clientWidth, h = wrap.clientHeight, k = Math.min(w/1920, h/1080);
  stage.style.transform = `translate(${(w-1920*k)/2}px,${(h-1080*k)/2}px) scale(${k})`;
}
if (qs.get('render')) {
  // 표지 촬영용: 정해진 시각의 한 장면만 그린다
  document.documentElement.classList.add('render');
  document.body.append(wrap); document.getElementById('page').remove();
  Object.assign(wrap.style,{position:'fixed',inset:0,aspectRatio:'auto'});
  fit();
  const sc = build(stage, CLIPS.find(c => c.id === qs.get('render')));
  window.__dur = sc.dur; window.__seek = t => sc.update(t);
  sc.update(+qs.get('t') || 0);
} else {
  const grid = document.getElementById('grid'), bPlay = document.getElementById('play'), scrub = document.getElementById('scrub'),
    tc = document.getElementById('tc'), now = document.getElementById('now'), bSpeed = document.getElementById('speed'), bLoop = document.getElementById('loop');
  const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  let cur = null, sc = null, t = 0, playing = false, loop = false, last = 0, speed = 1;
  new ResizeObserver(fit).observe(wrap); fit();
  const setPlay = p => { playing = p; bPlay.textContent = p ? '일시정지' : '재생'; };
  const draw = () => { sc.update(t); scrub.value = t/sc.dur*1000; tc.textContent = `${fmt(t)} / ${fmt(sc.dur)}`; };
  async function select(c, auto = true) {
    cur = c; t = 0; sc = build(stage, c); now.textContent = c.title; draw(); setPlay(false);
    [...grid.children].forEach(b => b.classList.toggle('sel', b.dataset.id === c.id));
    try { history.replaceState(null, '', '#' + c.id); } catch (e) {}
    // 사진을 받고 미리 풀어 둬야 첫 재생에서 멈칫하지 않는다
    const imgs = [...stage.querySelectorAll('img')];
    await Promise.race([Promise.all(imgs.map(i => i.decode().catch(() => {}))), new Promise(r => setTimeout(r, 3000))]);
    if (cur === c) { last = performance.now(); setPlay(auto); }
  }
  function frame(ts) {
    const dt = Math.min(.1, (ts-last)/1000); last = ts;
    if (sc && playing) {
      t += dt*speed;
      if (t >= sc.dur) { if (loop) t = 0; else { t = sc.dur; setPlay(false); } }
      draw();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(ts => { last = ts; frame(ts); });
  bPlay.onclick = () => { if (t >= sc.dur) t = 0; last = performance.now(); setPlay(!playing); };
  document.getElementById('restart').onclick = () => { t = 0; last = performance.now(); setPlay(true); draw(); };
  bSpeed.onclick = () => { speed = speed === 1 ? 1.5 : speed === 1.5 ? 2 : 1; bSpeed.textContent = speed + '배'; bSpeed.classList.toggle('on', speed > 1); };
  bLoop.onclick = () => { loop = !loop; bLoop.classList.toggle('on', loop); };
  const fullscreen = () => { const p = document.getElementById('player'); document.fullscreenElement ? document.exitFullscreen() : p.requestFullscreen?.(); };
  document.getElementById('full').onclick = fullscreen;
  scrub.oninput = () => { t = scrub.value/1000*sc.dur; draw(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
    const i = CLIPS.indexOf(cur);
    if (e.key === 'ArrowRight') select(CLIPS[(i+1)%CLIPS.length]);
    if (e.key === 'ArrowLeft') select(CLIPS[(i-1+CLIPS.length)%CLIPS.length]);
    if (e.key === 'f' || e.key === 'F') fullscreen();
  });
  CLIPS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.type = 'button'; b.dataset.id = c.id;
    b.innerHTML = `<div class="thumb" style="background-image:url('motion/p/${c.id}.jpg')"><span class="dur">${fmt(c.dur)}</span></div><div class="meta"><span class="no">${String(i+1).padStart(2,'0')}</span><h3>${c.title}</h3><p>${c.desc}</p></div>`;
    b.onclick = () => { select(c); document.getElementById('player').scrollIntoView({behavior:'smooth',block:'start'}); };
    grid.append(b);
  });
  select(CLIPS.find(c => '#'+c.id === location.hash) || CLIPS[0], false);
  // 나머지 영상의 사진도 미리 받아 둔다
  const keep = [];
  CLIPS.forEach(c => c.layers.forEach(l => { const im = new Image(); im.src = m(l.src); keep.push(im); }));
}
</script>
